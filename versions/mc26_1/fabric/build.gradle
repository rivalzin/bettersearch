plugins {

    id 'net.fabricmc.fabric-loom'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version_261}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {

    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }

    compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version_261}") { transitive = false }

    compileOnly("mezz.jei:jei-${jei_mc_261}-fabric:${jei_version_261}") { transitive = false }
    minecraft "com.mojang:minecraft:${minecraft_version_261}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version_261}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
