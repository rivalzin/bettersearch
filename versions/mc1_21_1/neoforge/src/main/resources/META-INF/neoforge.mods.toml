modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/rivalzin/BetterSearch/issues"

[[mods]]
modId = "bettersearch"
version = "${version}"
displayName = "Better Search"
authors = "rivalzin"
displayURL = "https://www.youtube.com/@Rivalzln"
logoFile = "SearchIconNEWICON512x512.png"
# Pixel art: sem suavizacao, para o icone ficar nitido na lista de mods.
logoBlur = false
description = '''
Makes search bars smarter and better!
'''

# Client-only: o mod nao precisa estar no servidor.
[[mixins]]
config = "bettersearch.mixins.json"

# Gancho no JEI. O plugin dentro dele devolve false quando o JEI nao esta instalado,
# entao sem JEI nada aqui e sequer carregado.
[[mixins]]
config = "bettersearch-jei.mixins.json"

# Gancho no EMI. Mesmo esquema: o plugin devolve false quando o EMI nao esta la.
[[mixins]]
config = "bettersearch-emi.mixins.json"

# Gancho no REI. Mesmo esquema: o plugin devolve false quando o REI nao esta la.
[[mixins]]
config = "bettersearch-rei.mixins.json"

[[dependencies.bettersearch]]
modId = "neoforge"
type = "required"
# As linhas 21.0 e 21.1 (= Minecraft 1.21 e 1.21.1), do mesmo jeito que a 1.21.9 cobre
# 1.21.9 e 1.21.10 com um jar so. O piso e 21.0.143 - a primeira 21.0.x ESTAVEL (as
# anteriores sao "-beta", codigo em movimento). Um limite superior AQUI nao e frescura: sem
# ele o NeoForge deixa o mod carregar em 1.21.4, 26.1, no que vier - e ai os mixins nao
# acham os alvos e o jogo quebra na cara do jogador.
versionRange = "[21.0.143,21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bettersearch]]
modId = "minecraft"
type = "required"
# 1.21 e 1.21.1. O "quase certamente" que morava neste comentario virou prova em
# 19/ago/2026 (ferramentas/sonda-121): o codigo de producao INTEIRO compilou contra o
# Minecraft 1.21 com NeoForge 21.0.167, e os alvos dos tres mixins vanilla foram conferidos
# um a um no bytecode de la - inclusive o SearchTree.search(String)List do livro de
# receitas, com descritor identico (na 1.18.2 esse mesmo ponto era MutableSearchTree e
# derrubava o jogo). Nao ha modulo mc1_21_0: e o MESMO jar, com a faixa alargada.
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "CLIENT"
