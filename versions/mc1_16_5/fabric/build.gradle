plugins {

    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-1.16.5"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {

    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1165}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1165}"

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-runtime:${rei_version_1165}") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api:${rei_version_1165}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
