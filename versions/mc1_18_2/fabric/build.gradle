plugins {

    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-1.18.2"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }

    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version_1182}")

    modCompileOnly("dev.emi:emi:${emi_version_1182}")

    modCompileOnly("mezz.jei:jei-${jei_mc_1182}-fabric:${jei_version_1182}")
    minecraft "com.mojang:minecraft:1.18.2"

    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1182}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1182}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
