plugins {
    id 'java'

    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-1.7.10"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mcVersion.set('1.7.10')

    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('12')
    username.set('rivalzin')
}

sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')

        java.srcDir file('src/neiApi/java')
    }
}

tasks.named('jar') {
    exclude 'codechicken/**'

    doLast {
        def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def vazou = zip.entries().findAll { it.name.startsWith('codechicken/') }
            if (!vazou.isEmpty()) {
                throw new GradleException("esboco do NEI vazou para o jar: ${vazou*.name}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

}
