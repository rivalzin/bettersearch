org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
# DESLIGADO de proposito. O RetroFuturaGradle (1.12.2 e 1.7.10) nao sobrevive a rodar em
# paralelo com o ModDevGradle e o Loom: o dist morria em mergeVanillaSidedJars com
# "Could not evaluate onlyIf predicate". Com --no-parallel o mesmo dist passa inteiro,
# nos 22 alvos. Build de um modulo so nao perde nada com isto - paralelo so vale entre
# projetos diferentes.
org.gradle.parallel=false
org.gradle.caching=true

# --- Minecraft --------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# --- Ferramentas de build -----------------------------------------------------------------
# O wrapper deste projeto e o Gradle 9.6.1 (gradle/wrapper/gradle-wrapper.properties).
#
# Subimos do 8.14.3 porque a 26.1 nao deixou escolha: ela exige Java 25, e o Gradle so passou
# a rodar em Java 25 na versao 9.1. Isso arrastou o Loom junto - a linha 1.13, que era a
# ultima a rodar em Gradle 8, ficou para tras.
#
# O Java que RODA o Gradle precisa ser 25 ou mais novo. O de cada modulo (17, 21, 25) o
# proprio Gradle baixa, graças ao foojay declarado no settings.gradle.
moddev_version=2.0.143
loom_version=1.17.17
# Fork do Loom que monta Forge, usado so pela 1.16.5 (veja settings.gradle).
architectury_loom_version=1.17.491

# --- NeoForge ---------------------------------------------------------------------------
# https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.233
loader_version_range=[1,)
# Nomes de parametros e javadoc do Minecraft (so ajuda a ler o codigo; nao vai no jar)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Fabric -----------------------------------------------------------------------------
# Os tres valores abaixo sao os do template oficial do Fabric para 1.21.1
# (https://github.com/FabricMC/fabric-example-mod/tree/1.21.1). Se o build reclamar que nao
# achou alguma dependencia, e AQUI que se conserta: confira em https://fabricmc.net/develop
fabric_loader_version=0.19.3
fabric_api_version=0.116.12+1.21.1
# Mod Menu: opcional, so para o botao de configuracao aparecer na lista de mods do Fabric.
modmenu_version=11.0.4

# --- Fabric 1.20.1 ------------------------------------------------------------------------
# O loader e o mesmo (ele nao amarra versao de Minecraft); a API e o Mod Menu sao por versao.
fabric_api_version_1201=0.92.9+1.20.1
modmenu_version_1201=7.2.2

# --- Minecraft 1.21.9 (o MESMO jar serve a 1.21.9 e a 1.21.10) ----------------------------
# A 1.21.10 foi so correcao de bugs: a API de cliente e identica a da 1.21.9 e o formato de
# pacote de recursos e o mesmo (69.0). Ja a 1.21.11 renomeou ResourceLocation para Identifier
# no jogo inteiro - por isso ela vai ganhar a propria pasta, e nao entra no intervalo daqui.
minecraft_version_2119=1.21.9
# 21.9.16-beta e o topo da linha 21.9; a linha nunca saiu do beta. Compilamos contra ELA (e
# nao contra a 21.10.64) para o compilador barrar qualquer API que so exista na 1.21.10.
neo_version_2119=21.9.16-beta
parchment_mappings_version_2119=2025.10.05
fabric_api_version_2119=0.134.1+1.21.9
modmenu_version_2119=16.0.1

# --- Minecraft 1.21.4 (sufixo 2114) -------------------------------------------------------
# A ultima da linha "Garden Awakens". Fica ANTES da reescrita do renderer (1.21.6) e dos
# eventos-objeto (1.21.9): a base do codigo e a 1.21.1, com as duas mudancas da linha 1.21.2
# (blit com RenderType e livro de receitas em RecipeDisplayEntry - veja o PORTING.md).
# Numeros lidos do maven-metadata de cada repositorio em 2026-08-17, nao deduzidos.
minecraft_version_2114=1.21.4
# 21.4.157 e o topo da linha 21.4 (estavel; a linha saiu do beta no 21.4.121).
neo_version_2114=21.4.157
# SEM Parchment nesta: o maven do Parchment bloqueia leitura de fora e a pagina de docs nao
# lista a 1.21.4 - sem fonte, sem numero (regra da casa). Parchment e so nome de parametro
# para leitura; nada dele entra no jar.
fabric_api_version_2114=0.119.2+1.21.4
modmenu_version_2114=13.0.4
# JEI/REI: numeros do maven, A CONFERIR contra os jars baixados na sonda (secao 10 cobra).
# ATENCAO: o JEI da 1.21.4 SO existe para NeoForge (maven.blamejared.com nao tem o artefato
# fabric, conferido em 2026-08-17) - como na 1.16.5, o gancho mora no modulo neoforge.
jei_mc_2114=1.21.4
jei_version_2114=20.0.0.4
rei_version_2114=18.0.815
# EMI: NAO existe para 1.21.4 (API do Modrinth, lista vazia, conferido em 2026-08-17).
# O gancho compila contra o jar 1.21.1 (${emi_version}), como na 1.21.9.

# --- Minecraft 26.1 (sufixo 261) ----------------------------------------------------------
# Um jar so cobre 26.1, 26.1.1 e 26.1.2. Compilamos contra a 26.1.2, a unica das tres que
# ganhou versao estavel do NeoForge (as outras duas so tiveram beta).
# Aqui comeca o mundo novo: Java 25, sem ofuscacao, sem Parchment, sem refmap.
minecraft_version_261=26.1.2
neo_version_261=26.1.2.94
fabric_api_version_261=0.151.0+26.1.2
modmenu_version_261=18.0.0

# --- Minecraft 26.2 (sufixo 262) ----------------------------------------------------------
# O NeoForge da 26.2 ainda esta em beta - e o mais novo que existe.
minecraft_version_262=26.2
neo_version_262=26.2.0.45-beta
fabric_api_version_262=0.152.2+26.2
modmenu_version_262=20.0.1

# --- Minecraft 1.21.11 (sufixo 21111) -----------------------------------------------------
# Sozinha, e nao junto da 1.21.9: aqui a Mojang renomeou ResourceLocation para Identifier no
# jogo inteiro, entao o binario e outro. Foi a ULTIMA versao ofuscada e a ultima em Java 21 -
# depois dela vem a 26.1, que exige Java 25 e Gradle 9.1+.
minecraft_version_21111=1.21.11
neo_version_21111=21.11.45
parchment_mappings_version_21111=2025.12.20
fabric_api_version_21111=0.141.4+1.21.11
modmenu_version_21111=17.0.0

# --- Forge 1.20.1 (e, de quebra, o NeoForge 1.20.1) ---------------------------------------
# 47.1.47 e a ULTIMA versao que o Forge e o NeoForge tem em comum: dali o NeoForge seguiu
# sozinho ate 47.1.106 e o Forge ate 47.4.x. Compilando contra esse ponto de bifurcacao, o
# compilador so deixa usar API que existe nos dois - e o MESMO jar roda no Forge 47.4.x e no
# NeoForge 20.1. Por isso nao existe uma pasta mc1_20_1/neoforge.
# Rodar em 47.4.10 esta ok: o Forge nao quebra compatibilidade binaria dentro da linha 47.
forge_version_1201=1.20.1-47.1.47

# --- Mod --------------------------------------------------------------------------------
mod_id=bettersearch
mod_name=Better Search
mod_license=MIT
mod_version=1.4.1
mod_group_id=com.rivalzin.bettersearch
mod_authors=rivalzin

# --- JEI --------------------------------------------------------------------------------
# Dependencia so de compilacao: o gancho da busca do JEI mira em classe interna dele
# (mezz.jei.gui.ingredients.IngredientFilter), que nao esta na API publica. Nao vai no jar e
# nao e obrigatoria em tempo de execucao - sem JEI instalado o plugin de mixin pula tudo.
# Estes numeros sao os que foram conferidos com javap. Subir de versao aqui exige reconferir.
jei_mc_1201=1.20.1
jei_version_1201=15.49.0.188
jei_mc=1.21.1
jei_version=19.44.0.401
jei_mc_2119=1.21.10
jei_version_2119=26.1.1.24
jei_mc_21111=1.21.11
jei_version_21111=27.23.0.71
jei_mc_261=26.1.2
jei_version_261=29.29.0.76
jei_mc_262=26.2
jei_version_262=30.24.0.165

# --- EMI ---------------------------------------------------------------------------------
# So existe para 1.20.1 e 1.21.1; nas versoes novas o EMI ainda nao foi portado, e por isso a
# opcao nem aparece na tela delas. Mesma logica do JEI: dependencia so de compilacao.
emi_version_1201=1.1.24+1.20.1
emi_version=1.1.24+1.21.1

# REI (Roughly Enough Items). So compilacao: o jar dele nunca entra no nosso.
rei_version_1201=12.1.785
rei_version=16.0.799
rei_version_2119=21.9.813
rei_version_21111=21.11.816
rei_version_261=26.1.819
rei_version_262=26.2.820

# ---- 1.19.2 -------------------------------------------------------------------------
# Ultimo Forge da linha 43 (a 1.19.2). O ModDevGradle legacy cobre de 1.17 a 1.20.1.
forge_version_1192=1.19.2-43.5.1
fabric_api_version_1192=0.77.0+1.19.2
modmenu_version_1192=4.2.0-beta.2
jei_mc_1192=1.19.2
jei_version_1192=11.39.0.1067
emi_version_1192=1.1.24+1.19.2
rei_version_1192=9.2.784

# ---- 1.18.2 -------------------------------------------------------------------------
# Todos os numeros abaixo foram lidos da fonte, nao deduzidos: os tres primeiros do
# maven-metadata.xml do repositorio de cada mod, os dois ultimos do jar baixado.
forge_version_1182=1.18.2-40.3.11
fabric_api_version_1182=0.77.0+1.18.2
modmenu_version_1182=3.2.5
jei_mc_1182=1.18.2
jei_version_1182=10.2.1.1002
# O EMI da 1.18.2 so existe para Fabric - por isso o gancho dele nao entra no modulo Forge.
# Atencao ao nome do artefato: nesta linha ele ainda e "dev.emi:emi", sem sufixo de loader.
# O "emi-fabric"/"emi-forge" so nasceu na 1.1.x, quando o EMI ganhou versao de Forge.
emi_version_1182=0.7.3+1.18.2
rei_version_1182=8.4.778

# ---- 1.16.5 -------------------------------------------------------------------------
# Ultimo Forge da linha 36 (o "latest" do promotions_slim.json da propria Forge).
# O ModDevGradle nao cobre esta versao e o ForgeGradle 5 nao roda em Gradle 9: aqui quem monta
# o lado Forge e o Architectury Loom. Os tres numeros abaixo foram lidos da fonte, nao deduzidos.
forge_version_1165=1.16.5-36.2.42
fabric_api_version_1165=0.42.0+1.16
modmenu_version_1165=1.16.23
# REI da 1.16.5. ATENCAO: sao DUAS bases de codigo diferentes no mesmo Minecraft.
#   Fabric -> linha 5.x, anterior a reescrita da API (EntryListWidget.allStacks)
#   Forge  -> linha 6.5, ja a API moderna (SearchProviderImpl.createFilter)
# Os dois numeros foram lidos do jar baixado (fabric.mod.json e mods.toml), nao deduzidos.
rei_version_1165=5.12.385
rei_version_1165_forge=6.5.436
# JEI da 1.16.5: so existe para Forge. Numero lido do mods.toml do jar baixado.
# ATENCAO: a 7.8 e anterior a separacao do JEI em "common" - outra forma de API, outro gancho.
# O EMI nao existe nesta versao do Minecraft.
jei_mc_1165=1.16.5
jei_version_1165=7.8.0.1009
# Escolhida a 7.8.0.1009 e nao a mais nova: e EXATAMENTE a que o modpack de teste roda, e e a
# mais antiga da linha - API que existe nela existe nas seguintes. A 7.8.1.1019 (o jar que eu
# tinha em maos para conferir) nem esta publicada no maven; a linha vai ate a 7.8.1.1018.
