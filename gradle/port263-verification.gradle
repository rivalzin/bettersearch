sourceSets {
    portVerification {
        java.srcDir rootProject.file('tools/port263')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

dependencies {
    portVerificationImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

tasks.register('port263Test', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('portVerificationClasses')
    classpath = sourceSets.portVerification.runtimeClasspath
    mainClass = 'com.rivalzin.bettersearch.tools.BetterSearchPort263Test'
    args project.name
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.named('check') {
    if (rootProject.file('tools/port263/BetterSearchPort263Test.java').isFile()) {
        dependsOn tasks.named('port263Test')
    }
}
