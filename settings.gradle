pluginManagement {
    // As versoes dos plugins ficam no gradle.properties junto com todas as outras, para
    // nao haver numero de versao espalhado por tres arquivos.
    plugins {
        id 'net.neoforged.moddev'             version "${moddev_version}"
        // Mesmo projeto, mesmo numero de versao: e o plugin do NeoForge para a plataforma
        // Forge ate a 1.20.1 (mapeamentos SRG, refmap de mixin, reofuscacao do jar).
        id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"

        /*
         * O Loom se partiu em dois quando a Mojang tirou a ofuscacao do Minecraft:
         *
         *   fabric-loom-remap  -> versoes OFUSCADAS (1.20.1 ate 1.21.11). Remapeia o jar.
         *   fabric-loom        -> versoes SEM ofuscacao (26.1 em diante). Nao remapeia nada.
         *
         * Os dois convivem no mesmo build, cada um no seu modulo. O id antigo (so
         * 'fabric-loom', sem prefixo) existe apenas por compatibilidade e nao e usado aqui.
         */
        id 'net.fabricmc.fabric-loom-remap'   version "${loom_version}"
        id 'net.fabricmc.fabric-loom'         version "${loom_version}"

        /*
         * Fork do Fabric Loom que tambem monta Forge, usado SO pela 1.16.5: o ModDevGradle
         * cobre de 1.17 a 1.20.1 e o ForgeGradle 5 recusa o Gradle 9. Provado na
         * ferramentas/sonda-1165 - inclusive que ele convive com o Fabric Loom no mesmo build.
         */
        id 'dev.architectury.loom'            version "${architectury_loom_version}"
    }

    repositories {
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Forge';     url = 'https://maven.minecraftforge.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        /*
         * Onde mora o RetroFuturaGradle (1.12.2). NAO esta no portal do Gradle - a sonda-1122
         * provou com dois 404s antes de achar o endereco no template da CleanroomMC.
         */
        maven {
            name = 'GTNH Nexus'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

/*
 * Deixa o Gradle baixar sozinho o JDK de cada modulo (17 para a 1.20.1, 21 para a 1.21.x,
 * 25 para a 26.x). Sem isto seria preciso ter os tres instalados na mao.
 *
 * Atencao: isto vale para a COMPILACAO. O Java que roda o proprio Gradle continua sendo o do
 * sistema - e ele precisa ser 25 ou mais novo para os modulos da 26.x.
 */
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

/*
 * A guarda fica AQUI, e nao no topo: o Gradle exige pluginManagement{} como primeira
 * instrucao e plugins{} logo depois - coloca-la antes deles nem compila (aconteceu).
 * Rodar depois nao muda nada na pratica: o settings inteiro avalia antes de qualquer
 * build.gradle de modulo, entao o RFG ainda nao foi carregado quando isto roda.
 */
if ((JavaVersion.current().majorVersion as int) < 25) {
    throw new GradleException(
        "O daemon do Gradle esta em Java " + JavaVersion.current().majorVersion + ", e o projeto precisa de Java 25.\n" +
        "  1) confira se existe o arquivo gradle\\gradle-daemon-jvm.properties nesta pasta;\n" +
        "  2) se nao existe, rode .\\atualizar.ps1 de novo (a primeira rodada so atualiza o proprio script);\n" +
        "  3) rode o build de novo. O Gradle vai achar o Temurin 25 do PATH sozinho.")
}


rootProject.name = 'BetterSearch'

/*
 * Tudo o que depende de versao mora em versions/: uma pasta por linha do Minecraft e, dentro
 * dela, uma por loader. Na raiz ficam so o core/, as ferramentas e a documentacao.
 *
 * Para acrescentar uma versao: copie versions/mc1_21_1, ajuste os build.gradle de dentro (os
 * caminhos la sao relativos, entao quase nada muda) e some duas linhas aqui. O core/ - o
 * algoritmo - e compartilhado por TODAS elas e nao precisa ser tocado.
 */
def modules = [
        // 1.21.1 - a primeira versao portada.
        'versions:mc1_21_1:neoforge', 'versions:mc1_21_1:fabric',
        'versions:mc1_21_4:neoforge', 'versions:mc1_21_4:fabric',

        // 1.21.9 - o mesmo jar cobre a 1.21.10 (veja minecraft_version_2119).
        'versions:mc1_21_9:neoforge', 'versions:mc1_21_9:fabric',

        // 1.21.11 sozinha: la o ResourceLocation virou Identifier, entao e outro binario.
        'versions:mc1_21_11:neoforge', 'versions:mc1_21_11:fabric',

        // Versionamento por calendario, Java 25 e Minecraft sem ofuscacao. O jar da 26.1
        // cobre tambem a 26.1.1 e a 26.1.2.
        'versions:mc26_1:neoforge', 'versions:mc26_1:fabric',
        'versions:mc26_2:neoforge', 'versions:mc26_2:fabric',

        // Nao ha 'versions:mc1_20_1:neoforge': na 1.20.1 o NeoForge ainda era o Forge 47 com outro
        // nome, e o jar do Forge roda nos dois. O porque esta em forge_version_1201.
        'versions:mc1_20_1:fabric', 'versions:mc1_20_1:forge',

        // 1.19.2 - primeiro port para tras. Mesmo plugin da 1.20.1 (o legacy do ModDevGradle
        // cobre de 1.17 a 1.20.1), Java 17 e mapeamentos da Mojang: a arquitetura de um codigo
        // para dois loaders continua valendo aqui.
        'versions:mc1_19_2:fabric', 'versions:mc1_19_2:forge',

        // 1.18.2 - o lado vanilla e quase igual ao da 1.19.2, mas o JEI e o EMI de la sao
        // outra coisa (veja PORTING.md). Ultima versao com mapeamentos da Mojang que o mod
        // cobre por enquanto.
        'versions:mc1_18_2:fabric', 'versions:mc1_18_2:forge',

        // 1.16.5 - primeira versao em Java 8 e a unica que nao usa o ModDevGradle no Forge.
        // Os ganchos de JEI/REI ainda nao existem aqui (veja _integracoes-pendentes).
        'versions:mc1_16_5:fabric', 'versions:mc1_16_5:forge',

        // 1.12.2 - montada pelo RetroFuturaGradle (veja o build.gradle dela). A sonda-1122
        // provou que ele convive com o Fabric Loom no mesmo build. So Forge: Fabric nao
        // existe para esta versao.
        'versions:mc1_12_2:forge',

        // 1.7.10 - a casa do proprio RetroFuturaGradle. A sonda-1710 provou as duas coisas
        // que faltavam: ele monta a 1.7.10 nesta maquina E convive com o RFG da 1.12.2 no
        // MESMO build (duas versoes de Minecraft, um plugin). So Forge, como a 1.12.2.
        'versions:mc1_7_10:forge',
]

/*
 * Do Gradle 9 em diante, declarar um modulo cuja pasta nao existe e ERRO - antes era so um
 * aviso. Como cada versao chega aqui como uma pasta que ainda vai ser extraida, sem esta
 * guarda o projeto INTEIRO para de configurar por causa de uma pasta ausente, e nenhuma das
 * outras versoes compila. Assim ele avisa e segue em frente.
 */
modules.each { path ->
    File dir = new File(settingsDir, path.replace(':', '/'))
    if (dir.isDirectory()) {
        include path
    } else {
        println "[BetterSearch] modulo '${path}' ignorado: a pasta ${dir} ainda nao existe."
    }
}

/*
 * O Architectury Loom escolhe Forge ou Fabric pela propriedade loom.platform. Marcar isso no
 * gradle.properties da raiz valeria para o projeto INTEIRO, e os oito modulos Fabric passariam
 * a se achar Forge. O beforeProject roda antes de cada modulo ser avaliado - ou seja, antes de
 * o plugin ler a propriedade - e permite marcar so quem precisa.
 *
 * Este e o mecanismo que a sonda C testou e aprovou; um gradle.properties dentro da pasta do
 * modulo nao foi testado, entao nao e usado.
 */
gradle.beforeProject { projeto ->
    if (projeto.path == ':versions:mc1_16_5:forge') {
        projeto.ext['loom.platform'] = 'forge'
    }
}
