plugins {
    id 'base'
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

configurations {
    verificationGson
    verificationBrigadier
}

dependencies {
    verificationGson 'com.google.code.gson:gson:2.2.4'
    verificationBrigadier 'com.mojang:brigadier:1.3.10'
}

def coreTestDir = layout.buildDirectory.dir('coreTest')
def lifecycleTestDir = layout.buildDirectory.dir('lifecycleTest')
def enterTestDir = layout.buildDirectory.dir('enterTest')

tasks.register('compileCoreTest', JavaCompile) {
    group = 'verification'
    source = fileTree('core/src/main/java/com/rivalzin/bettersearch/core') + files('tools/BetterSearchCoreTest.java')
    include '**/*.java'
    classpath = files()
    destinationDirectory = coreTestDir
    options.encoding = 'UTF-8'
    sourceCompatibility = '8'
    targetCompatibility = '8'
    options.release = 8
}

tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Testa o algoritmo compartilhado com compatibilidade Java 8.'
    dependsOn 'compileCoreTest'
    classpath = files(coreTestDir)
    mainClass = 'com.rivalzin.bettersearch.tools.BetterSearchCoreTest'
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('compileLifecycleTest', JavaCompile) {
    group = 'verification'
    source = fileTree('core/src/main/java') + fileTree('tools/async') { include '*.java' } +
            files('tools/state/BetterSearchStateTest.java', 'tools/FailurePolicyTest.java')
    include '**/*.java'
    classpath = configurations.verificationGson
    destinationDirectory = lifecycleTestDir
    options.encoding = 'UTF-8'
    sourceCompatibility = '8'
    targetCompatibility = '8'
    options.release = 8
}

['asyncTest': 'BetterSearchAsyncTest', 'stateTest': 'BetterSearchStateTest',
 'failurePolicyTest': 'FailurePolicyTest'].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn 'compileLifecycleTest'
        classpath = files(lifecycleTestDir) + configurations.verificationGson
        mainClass = "com.rivalzin.bettersearch.tools.${className}"
        jvmArgs '-Dfile.encoding=UTF-8'
        if (taskName == 'stateTest') {
            doFirst {
                args = [layout.buildDirectory.dir("state-test/gradle-${UUID.randomUUID()}").get().asFile.absolutePath]
            }
        }
    }
}

tasks.register('compileEnterTest', JavaCompile) {
    group = 'verification'
    dependsOn 'compileCoreTest'
    source = files('tools/enter/BetterSearchEnterTest.java')
    classpath = files(coreTestDir) + configurations.verificationBrigadier
    destinationDirectory = enterTestDir
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
}

tasks.register('enterTest', JavaExec) {
    group = 'verification'
    dependsOn 'compileEnterTest'
    classpath = files(coreTestDir, enterTestDir) + configurations.verificationBrigadier
    mainClass = 'com.rivalzin.bettersearch.tools.BetterSearchEnterTest'
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.named('check') {
    if (file('tools/BetterSearchCoreTest.java').isFile()) {
        dependsOn 'coreTest', 'asyncTest', 'stateTest', 'failurePolicyTest', 'enterTest'
    }
}

tasks.register('dist', Sync) {
    group = 'build'
    description = 'Testa e compila os loaders configurados e copia somente os jars desta versao.'
    dependsOn 'check'
    def targets = subprojects.findAll { it.name in ['forge', 'neoforge', 'fabric'] }
    if (targets.isEmpty()) {
        throw new GradleException('dist exige os modulos Minecraft; remova -PcoreOnly=true.')
    }
    targets.each { target ->
        dependsOn "${target.path}:build"
        from(target.layout.buildDirectory.dir('libs')) {
            include "*-${mod_version}.jar"
            exclude '*-sources.jar', '*-dev.jar', '*-dev-shadow.jar', '*-shadow.jar'
        }
    }
    into layout.buildDirectory.dir('dist')
}
